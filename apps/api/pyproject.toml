[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[project]
name = "wordheat-api"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic>=2,<3", "sqlalchemy>=2,<3", "psycopg[binary]>=3,<4", "cryptography>=43,<47", "rfc8785>=0.1,<1", "httpx>=0.27,<1", "python-multipart>=0.0.18,<1", "websockets==17.3"]
[project.optional-dependencies]
test = ["pytest>=8,<10", "jsonschema>=4,<5", "pyyaml>=6,<7"]
[project.scripts]
wordheat-api = "app.cli:main"
[tool.setuptools.packages.find]
include = ["app*", "migrations*"]
[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
"migrations.versions" = ["*.sql"]
