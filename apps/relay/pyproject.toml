[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "wordheat-relay"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["fastapi>=0.115,<1", "psycopg[binary]>=3.2,<4", "uvicorn>=0.30,<1", "cryptography>=43,<47", "rfc8785>=0.1,<1", "httpx>=0.27,<1", "websockets==17.3"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]

[tool.setuptools.packages.find]
include = ["app*", "migrations*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short"

[tool.setuptools.package-data]
migrations = ["*.sql"]

[project.scripts]
wordheat-relay = "app.cli:main"
