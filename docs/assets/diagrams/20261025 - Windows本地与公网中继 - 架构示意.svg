<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1180" viewBox="0 0 1700 1180" role="img" aria-label="Windows本机权威与公网轻量中继拟实施架构"><style>text{font-family:system-ui,'PingFang SC','Microsoft YaHei',sans-serif}</style><defs><marker id="windows-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#69dfc0"/></marker><marker id="windows-amber-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#f2ba66"/></marker></defs><rect width="1700" height="1180" rx="20" fill="#0d192a"/><text x="40" y="56" fill="#f2eddf" font-size="37" font-weight="700">P-W · Windows 本地 + 公网轻量中继</text><text x="40" y="98" fill="#f2ba66" font-size="22" font-weight="400">方案架构示意 · v1.1 · 2026.10.25 · 未实施 / 未接通 · 具体契约以主文档为准</text><rect x="40" y="140" width="600" height="110" rx="15" fill="#15263b" stroke="#496077"/><text x="66" y="183" fill="#f2eddf" font-size="27" font-weight="600">抖音官方平台</text><text x="66" y="224" fill="#a1b3c4" font-size="21" font-weight="400">HTTPS 回调 / received、processed 履约接口</text><path d="M340 250 L340 295" stroke="#69dfc0" stroke-width="3" fill="none" marker-end="url(#windows-arrow)"/><rect x="40" y="295" width="600" height="565" rx="15" fill="#102337" stroke="#69dfc0"/><text x="66" y="338" fill="#f2eddf" font-size="28" font-weight="600">公网中继 · 轻量服务</text><rect x="66" y="367" width="548" height="100" rx="15" fill="#15263b" stroke="#496077"/><text x="90" y="406" fill="#69dfc0" font-size="25" font-weight="600">HTTPS 验签 → 中继持久库 / 收件箱</text><text x="90" y="443" fill="#a1b3c4" font-size="21" font-weight="400">先持久化，再按官方契约确认接收</text><rect x="66" y="489" width="548" height="110" rx="15" fill="#15263b" stroke="#496077"/><text x="90" y="529" fill="#f2eddf" font-size="25" font-weight="600">投递流 / 代际分离</text><text x="90" y="558" fill="#a1b3c4" font-size="19" font-weight="400">stream_seq；原 owner_generation 不可变</text><text x="90" y="585" fill="#a1b3c4" font-size="19">delivery_generation 仅代表当前授权</text><rect x="66" y="620" width="548" height="125" rx="15" fill="#15263b" stroke="#496077"/><text x="90" y="659" fill="#f2ba66" font-size="25" font-weight="600">独立履约 outbox → 官方上报</text><text x="90" y="699" fill="#a1b3c4" font-size="21" font-weight="400">received / processed 按官方契约分别处理</text><text x="90" y="730" fill="#a1b3c4" font-size="20" font-weight="400">不把传输 ACK 当作玩法处理完成</text><text x="66" y="798" fill="#f2ba66" font-size="24" font-weight="600">云端不保存谜底 · 不做 BGE 推理</text><text x="66" y="835" fill="#a1b3c4" font-size="21" font-weight="400">不拥有回合、积分和结算权威</text><rect x="850" y="140" width="810" height="720" rx="15" fill="#102337" stroke="#69dfc0"/><text x="878" y="182" fill="#f2eddf" font-size="28" font-weight="600">Windows 主播电脑 · 本机业务权威</text><rect x="878" y="205" width="754" height="82" rx="15" fill="#15263b" stroke="#496077"/><text x="900" y="239" fill="#69dfc0" font-size="24" font-weight="600">本机主动建立 WSS 长连接到中继</text><text x="900" y="272" fill="#a1b3c4" font-size="20" font-weight="400">不开放公网入站；重连校验当前 delivery_generation</text><path d="M850 307 L640 307" stroke="#69dfc0" stroke-width="3" fill="none" marker-end="url(#windows-arrow)"/><text x="678" y="285" fill="#69dfc0" font-size="19" font-weight="400">主动连接</text><rect x="878" y="318" width="754" height="133" rx="15" fill="#15263b" stroke="#496077"/><text x="900" y="358" fill="#f2eddf" font-size="27" font-weight="600">FastAPI · 1 个业务进程</text><text x="900" y="397" fill="#a1b3c4" font-size="21" font-weight="400">接收投递 → 本地持久化 / 去重 → 按回合水位处理</text><text x="900" y="432" fill="#a1b3c4" font-size="21" font-weight="400">仅真实有效事件进入实时评分与账本</text><path d="M640 385 L850 385" stroke="#69dfc0" stroke-width="3" fill="none" marker-end="url(#windows-arrow)"/><text x="664" y="349" fill="#69dfc0" font-size="20" font-weight="400">事件投递</text><text x="653" y="412" fill="#a1b3c4" font-size="18" font-weight="400">seq / generation</text><path d="M850 490 L640 490" stroke="#69dfc0" stroke-width="3" fill="none" marker-end="url(#windows-arrow)"/><text x="659" y="464" fill="#69dfc0" font-size="20" font-weight="400">persisted ACK</text><text x="659" y="518" fill="#a1b3c4" font-size="19" font-weight="400">本地落库确认</text><path d="M850 580 L640 580" stroke="#f2ba66" stroke-width="3" fill="none" marker-end="url(#windows-amber-arrow)"/><text x="659" y="553" fill="#f2ba66" font-size="20" font-weight="400">履约状态回传</text><text x="659" y="608" fill="#a1b3c4" font-size="19" font-weight="400">与 ACK 分离</text><rect x="878" y="477" width="365" height="122" rx="15" fill="#15263b" stroke="#496077"/><text x="900" y="518" fill="#69dfc0" font-size="25" font-weight="600">本地 PostgreSQL</text><text x="900" y="554" fill="#f2eddf" font-size="21" font-weight="400">权威回合 / 事件 / 账本</text><text x="900" y="585" fill="#a1b3c4" font-size="19" font-weight="400">本地持久化后才回 ACK</text><rect x="1265" y="477" width="367" height="122" rx="15" fill="#15263b" stroke="#496077"/><text x="1287" y="518" fill="#f2eddf" font-size="25" font-weight="600">独立 BGE 进程</text><text x="1287" y="554" fill="#f2eddf" font-size="21" font-weight="400">仅内部 HTTP 推理</text><text x="1287" y="585" fill="#a1b3c4" font-size="19" font-weight="400">固定版本；不上传谜底</text><rect x="878" y="627" width="754" height="176" rx="15" fill="#15263b" stroke="#496077"/><text x="900" y="666" fill="#f2eddf" font-size="24" font-weight="600">React 主播私有页 → 本地业务控制</text><text x="900" y="711" fill="#69dfc0" font-size="24" font-weight="600">React 公开展示页 → OBS 浏览器源</text><text x="900" y="752" fill="#a1b3c4" font-size="21" font-weight="400">仅公开字段；刷新不重置回合 / 不重复结算</text><text x="900" y="786" fill="#f2ba66" font-size="20" font-weight="400">普通 OBS 路径 ≠ 已获认可的官方客户端包体</text><rect x="40" y="896" width="1620" height="230" rx="15" fill="#15263b" stroke="#f2ba66"/><text x="66" y="940" fill="#f2ba66" font-size="27" font-weight="600">运行边界与验收要求</text><text x="66" y="978" fill="#f2eddf" font-size="24" font-weight="400">短重连冻结提交；达故障判据后中断旧轮。</text><text x="66" y="1016" fill="#f2eddf" font-size="22">故障中断后的历史补投及演练回放不计实时积分；</text><text x="66" y="1048" fill="#f2eddf" font-size="22">有效窗口内短重投按正文处理。persisted ACK、received 与 processed 分别记录。</text><text x="66" y="1083" fill="#a1b3c4" font-size="23" font-weight="400">本图不表示平台权限、WSS 链路、Windows 安装、模型性能或真实直播已经验收。</text><text x="66" y="1115" fill="#a1b3c4" font-size="21" font-weight="400">平台正式发布形态、官方客户端与履约语义均须通过 G0 / G2 实测确认。</text></svg>